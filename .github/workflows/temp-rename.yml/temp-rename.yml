name: temp-rename
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-rename.yml'
jobs:
  rename:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm index.html
          git mv game-of-the-year-2026.html index.html
          git commit -m "Replace index.html with new GOTY vote site version"
          git push
