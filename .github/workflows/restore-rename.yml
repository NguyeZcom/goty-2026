name: Restore and rename GOTY file
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore-rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore new version and replace index.html
        run: |
          git checkout b3926f7 -- game-of-the-year-2026.html
          git rm -f index.html rename-test.html
          git mv game-of-the-year-2026.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Replace index.html with new GOTY vote site version"
          git push
